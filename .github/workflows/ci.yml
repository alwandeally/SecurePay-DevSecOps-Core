name: SecurePay DevSecOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: securepay-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-scan:
    name: Build, test, and security scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore SecurePay.sln

      - name: Build solution
        run: dotnet build SecurePay.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test SecurePay.sln --configuration Release --no-build --verbosity normal

      - name: Check NuGet packages for vulnerabilities
        run: dotnet list SecurePay.sln package --vulnerable --include-transitive

      - name: Scan Git history for verified secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

      - name: Build Identity API image
        run: >
          docker build
          --file src/SecurePay.Identity.Api/Dockerfile
          --tag securepay-identity-api:${{ github.sha }}
          .

      - name: Build Transactions API image
        run: >
          docker build
          --file src/SecurePay.Transactions.Api/Dockerfile
          --tag securepay-transactions-api:${{ github.sha }}
          .

      - name: Scan Identity API image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: securepay-identity-api:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Scan Transactions API image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: securepay-transactions-api:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
