server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-store" always;

    location = /api/operations/transactions {
        if ($request_method != GET) { return 405; }
        # Docker embedded DNS; resolve per request so the standalone demo still starts.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $transactions_backend transactions-api:8080;
        proxy_pass http://$transactions_backend$request_uri;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        # Avoid logging transaction query strings.
        access_log off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 8s;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    location ~ /\. {
        deny all;
    }
    location ~* /(?:README\.md|nginx\.conf|Dockerfile)$ {
        deny all;
    }
}
